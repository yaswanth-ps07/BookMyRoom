<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">BookMyRoom</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings">Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/availability">Check Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card form-card mb-4">
                <div class="card-body">
                    <h3 class="form-title">Check Availability</h3>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/bookings/availability}" method="post" class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label">Check-In Date</label>
                            <input type="date" name="checkIn" class="form-control" th:value="${checkIn}">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Check-Out Date</label>
                            <input type="date" name="checkOut" class="form-control" th:value="${checkOut}">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Check Availability</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card dashboard-card">
                <div class="card-body">
                    <h4 class="section-title">Available Rooms</h4>
                    <div class="table-responsive">
                        <table class="table table-dark table-striped align-middle">
                            <thead>
                            <tr>
                                <th>Room Number</th>
                                <th>Room Type</th>
                                <th>Capacity</th>
                                <th>Rate / Night</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="room : ${availableRooms}">
                                <td th:text="${room.roomNumber}">101</td>
                                <td th:text="${room.roomType}">Single</td>
                                <td th:text="${room.capacity}">1</td>
                                <td th:text="${'₹' + room.ratePerNight}">₹1200</td>
                                <td><span class="badge bg-success" th:text="${room.status}">Available</span></td>
                                <td><a class="btn btn-sm btn-success" th:href="@{/bookings/add}">Book Now</a></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(availableRooms)}">
                                <td colspan="6" class="text-center text-muted">No available rooms for the selected dates.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
