<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">BookMyRoom</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card">
                <div class="card-body text-center">
                    <h2 class="form-title text-danger">Something went wrong</h2>
                    <p class="text-light" th:text="${errorMessage}">Please try again.</p>
                    <div th:if="${validationErrors != null}" class="mt-3">
                        <ul class="list-group list-group-flush text-start">
                            <li class="list-group-item bg-transparent text-light" th:each="entry : ${validationErrors}">
                                <strong th:text="${entry.key}">field</strong>: <span th:text="${entry.value}">message</span>
                            </li>
                        </ul>
                    </div>
                    <a href="/" class="btn btn-primary mt-3">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
