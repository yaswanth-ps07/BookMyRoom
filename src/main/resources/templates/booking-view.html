<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">BookMyRoom</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings">Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/availability">Check Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card booking-details">
                <div class="card-body">
                    <h3 class="form-title">Booking Details</h3>
                    <div class="row g-3 booking-details-grid">
                        <div class="col-md-6 detail-item">
                            <div class="detail-label">Booking ID</div>
                            <div class="detail-value" th:text="${booking.id}">1</div>
                        </div>
                        <div class="col-md-6 detail-item">
                            <div class="detail-label">Guest</div>
                            <div class="detail-value" th:text="${booking.guest.name}">Guest Name</div>
                        </div>
                        <div class="col-md-6 detail-item">
                            <div class="detail-label">Room</div>
                            <div class="detail-value" th:text="${booking.room.roomNumber}">101</div>
                        </div>
                        <div class="col-md-6 detail-item">
                            <div class="detail-label">Status</div>
                            <div class="detail-value">
                                <span class="badge status-confirmed" th:text="${booking.status}">Confirmed</span>
                            </div>
                        </div>
                        <div class="col-md-6 detail-item">
                            <div class="detail-label">Check-In</div>
                            <div class="detail-value" th:text="${booking.checkInDate}">2026-09-28</div>
                        </div>
                        <div class="col-md-6 detail-item">
                            <div class="detail-label">Check-Out</div>
                            <div class="detail-value" th:text="${booking.checkOutDate}">2026-09-30</div>
                        </div>
                        <div class="col-md-6 detail-item">
                            <div class="detail-label">Total Cost</div>
                            <div class="detail-value" th:text="${'₹' + #numbers.formatDecimal(booking.totalCost, 1, 'COMMA', 2, 'POINT')}">₹0.00</div>
                        </div>
                        <div class="col-md-6 detail-item">
                            <div class="detail-label">Booked At</div>
                            <div class="detail-value" th:text="${#temporals.format(booking.bookedAt, 'dd MMM yyyy, h:mm a')}">28 Sep 2026, 10:24 AM</div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a href="/bookings" class="btn btn-primary">Back to Bookings</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
