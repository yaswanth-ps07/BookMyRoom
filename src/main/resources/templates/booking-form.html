<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">BookMyRoom</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings">Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/availability">Check Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card">
                <div class="card-body">
                    <h3 class="form-title">Create Booking</h3>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                    <form th:action="@{/bookings/save}" th:object="${booking}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Guest</label>
                                <select th:field="*{guest}" class="form-select">
                                    <option value="">Select Guest</option>
                                    <option th:each="guest : ${guests}" th:value="${guest.id}" th:text="${guest.name}">Guest</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Room</label>
                                <select th:field="*{room}" class="form-select">
                                    <option value="">Select Room</option>
                                    <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.roomNumber + ' (' + room.roomType + ')'}">Room</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Check-In Date</label>
                                <input type="date" th:field="*{checkInDate}" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Check-Out Date</label>
                                <input type="date" th:field="*{checkOutDate}" class="form-control">
                            </div>
                        </div>
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Confirm Booking</button>
                            <a href="/bookings" class="btn btn-outline-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
