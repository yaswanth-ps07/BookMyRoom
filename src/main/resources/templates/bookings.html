<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">BookMyRoom</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings">Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/availability">Check Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Bookings</h2>
        </div>
        <a href="/bookings/add" class="btn btn-primary">+ Add Booking</a>
    </div>

    <form th:action="@{/bookings/search}" method="get" class="row g-2 mb-3">
        <div class="col-md-6">
            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search by guest, room or status">
        </div>
        <div class="col-md-4">
            <select name="status" class="form-select">
                <option value="">All Status</option>
                <option value="Confirmed" th:selected="${status == 'Confirmed'}">Confirmed</option>
                <option value="Cancelled" th:selected="${status == 'Cancelled'}">Cancelled</option>
                <option value="Completed" th:selected="${status == 'Completed'}">Completed</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-outline-light w-100">Filter</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-dark table-striped align-middle">
            <thead>
            <tr>
                <th>Booking ID</th>
                <th>Guest</th>
                <th>Room</th>
                <th>Check-In</th>
                <th>Check-Out</th>
                <th>Nights</th>
                <th>Total Cost</th>
                <th>Booking Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.id}">1</td>
                <td th:text="${booking.guest.name}">Guest</td>
                <td th:text="${booking.room.roomNumber}">101</td>
                <td th:text="${booking.checkInDate}">2026-01-01</td>
                <td th:text="${booking.checkOutDate}">2026-01-03</td>
                <td th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(booking.checkInDate, booking.checkOutDate)}">2</td>
                <td th:text="${'₹' + #numbers.formatDecimal(booking.totalCost, 1, 'COMMA', 2, 'POINT')}">₹0</td>
                <td>
                    <span class="badge status-confirmed" th:if="${booking.status == 'Confirmed'}">Confirmed</span>
                    <span class="badge status-cancelled" th:if="${booking.status == 'Cancelled'}">Cancelled</span>
                    <span class="badge status-completed" th:if="${booking.status == 'Completed'}">Completed</span>
                </td>
                <td>
                    <a th:href="@{/bookings/view/{id}(id=${booking.id})}" class="btn btn-sm btn-info">View</a>
                    <a th:href="@{/bookings/cancel/{id}(id=${booking.id})}" class="btn btn-sm btn-warning" th:if="${booking.status != 'Cancelled'}">Cancel</a>
                    <a th:href="@{/bookings/delete/{id}(id=${booking.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this booking?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="9" class="text-center text-muted">No bookings found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
