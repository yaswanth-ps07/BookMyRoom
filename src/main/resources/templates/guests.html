<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">BookMyRoom</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings">Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/availability">Check Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Guests</h2>
        </div>
        <a href="/guests/add" class="btn btn-primary">+ Add Guest</a>
    </div>

    <form th:action="@{/guests/search}" method="get" class="row g-2 mb-4">
        <div class="col-md-10">
            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search guests by name, email or phone">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-outline-light w-100">Search</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-dark table-striped align-middle">
            <thead>
            <tr>
                <th>Guest ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="guest : ${guests}">
                <td th:text="${guest.id}">1</td>
                <td th:text="${guest.name}">Arun</td>
                <td th:text="${guest.email}">arun@example.com</td>
                <td th:text="${guest.phone}">9876543210</td>
                <td th:text="${guest.address}">Coimbatore</td>
                <td>
                    <a th:href="@{/guests/edit/{id}(id=${guest.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{/guests/delete/{id}(id=${guest.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this guest?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(guests)}">
                <td colspan="6" class="text-center text-muted">No guests found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
