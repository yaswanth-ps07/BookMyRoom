<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">BookMyRoom</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings">Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/availability">Check Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Rooms</h2>
        </div>
        <a href="/rooms/add" class="btn btn-primary">+ Add Room</a>
    </div>

    <form th:action="@{/rooms/search}" method="get" class="row g-2 mb-4">
        <div class="col-md-10">
            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search rooms by room number or room type">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-outline-light w-100">Search</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-dark table-striped align-middle">
            <thead>
            <tr>
                <th>Room ID</th>
                <th>Room Number</th>
                <th>Room Type</th>
                <th>Capacity</th>
                <th>Rate / Night</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="room : ${rooms}">
                <td th:text="${room.id}">1</td>
                <td th:text="${room.roomNumber}">101</td>
                <td th:text="${room.roomType}">Single</td>
                <td th:text="${room.capacity}">2</td>
                <td th:text="${'₹' + room.ratePerNight}">₹1200</td>
                <td><span class="badge bg-success" th:text="${room.status}">Available</span></td>
                <td>
                    <a th:href="@{/rooms/edit/{id}(id=${room.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{/rooms/delete/{id}(id=${room.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this room?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rooms)}">
                <td colspan="7" class="text-center text-muted">No rooms found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
