<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">BookMyRoom</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings">Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/availability">Check Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card">
                <div class="card-body">
                    <h3 class="form-title" th:text="${room.id != null ? 'Edit Room' : 'Add Room'}">Add Room</h3>

                    <form th:action="${room.id != null ? '/rooms/update/' + room.id : '/rooms/save'}" th:object="${room}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Room Number</label>
                                <input type="text" th:field="*{roomNumber}" class="form-control">
                                <div class="text-danger" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Room Type</label>
                                <input type="text" th:field="*{roomType}" class="form-control">
                                <div class="text-danger" th:if="${#fields.hasErrors('roomType')}" th:errors="*{roomType}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Capacity</label>
                                <input type="number" th:field="*{capacity}" class="form-control">
                                <div class="text-danger" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Rate / Night</label>
                                <input type="number" step="0.01" th:field="*{ratePerNight}" class="form-control">
                                <div class="text-danger" th:if="${#fields.hasErrors('ratePerNight')}" th:errors="*{ratePerNight}"></div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Status</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="Available">Available</option>
                                    <option value="Maintenance">Maintenance</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a href="/rooms" class="btn btn-outline-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
